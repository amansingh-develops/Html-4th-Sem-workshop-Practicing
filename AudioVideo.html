<!DOCTYPE html>
<html>
<head>
  <title>HTML5 Audio and Video Example</title>
</head>
<body>
  <h2>HTML5 Audio and Video Example</h2>
  
  <h3>Audio Example:</h3>
  <audio controls>
    <source src="example_audio.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  
  <h3>Video Example:</h3>
  <video controls width="480" height="360">
    <source src="https://youtu.be/YyepU5ztLf4?si=qMW555nPlPc7QclE" type="video/mp4">
    Your browser does not support the video element.
  </video>
<iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/8o4ZsuCdtNY?si=qeNWH_zgmnlbRQO3" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
