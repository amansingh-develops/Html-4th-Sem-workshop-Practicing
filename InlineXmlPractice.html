<!DOCTYPE html>
<html>
<head>
    <title>CD Catalog</title>
</head>
<body>

<h2>CD Catalog</h2>

<table border="1" id="cdTable">
    <tr>
        <th>Artist</th>
        <th>Title</th>
    </tr>
</table>

<script>
    // XML data
    var xmlData = `
    <CD_catalog>
        <CD>
            <ARTIST>Michael Jackson</ARTIST>
            <TITLE>Thriller</TITLE>
        </CD>
        <CD>
            <ARTIST>The Beatles</ARTIST>
            <TITLE>Abbey Road</TITLE>
        </CD>
        <CD>
            <ARTIST>Queen</ARTIST>
            <TITLE>A Night at the Opera</TITLE>
        </CD>
    </CD_catalog>
    `;

    // Parse XML
    var parser = new DOMParser();
    var xmlDoc = parser.parseFromString(xmlData, "text/xml");

    // Get CD elements
    var cds = xmlDoc.getElementsByTagName("CD");
    var table = document.getElementById("cdTable");

    // Add data to table
    for (var i = 0; i < cds.length; i++) {
        var artist = cds[i].getElementsByTagName("ARTIST")[0].textContent;
        var title = cds[i].getElementsByTagName("TITLE")[0].textContent;

        var row = table.insertRow();
        row.insertCell(0).innerHTML = artist;
        row.insertCell(1).innerHTML = title;
    }
</script>

</body>
</html>
