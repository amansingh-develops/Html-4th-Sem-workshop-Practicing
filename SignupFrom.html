24 Design a HTML registration form that takes user name, user password and mobile number with submit button control


<!DOCTYPE html>
<html>
<head>
  <title>Registration Form</title>
  <style>
    form {
      width: 300px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: #f2f2f2;
      font-family: Arial, sans-serif;
    }
    input[type="text"], input[type="password"], input[type="tel"] {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    input[type="submit"] {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <form action="/submit_form" method="post">
    <h2>Register</h2>
    <label for="username">User Name:</label>
    <input type="text" id="username" name="username" required placeholder="Enter Your username">

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <label for="mobile">Mobile Number:</label>
    <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required placeholder="10-digit number">

    <input type="submit" value="Submit">
  </form>
</body>
</html>
